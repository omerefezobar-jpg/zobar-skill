name: CI & Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test Academic Paper Fetcher (arXiv)
      run: |
        python scripts/fetch_academic_papers.py "distributed consensus" --max 2

    - name: Test Sentiment Miner (Hacker News)
      run: |
        python scripts/mine_user_sentiment.py "microservices" --max 2

    - name: Test Patent Prior Art Searcher (Google Patents)
      run: |
        python scripts/search_prior_art.py "distributed consensus" --max 2

    - name: Test Dossier Orchestrator
      run: |
        python run_innovator.py "Artificial Intelligence" --output ci_test.md
        cat ci_test.md
