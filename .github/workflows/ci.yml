name: CI & Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Deterministic Unit Tests & Security Suite
      run: |
        python -m unittest discover tests

    - name: Run Ground-Truth Accuracy & Evaluation Benchmark Suite
      run: |
        python benchmarks/run_benchmarks.py

    - name: Run Dossier & HTML Export Smoke Test
      run: |
        python scripts/export_html_report.py examples/sample-innovator-report.md --output ci_report.html
        test -f ci_report.html
